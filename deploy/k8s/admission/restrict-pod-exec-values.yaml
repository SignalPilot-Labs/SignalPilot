---
# Kyverno CLI values for restrict-pod-exec.test.yaml (F-21).
#
# NOTE on schema: ValuesSpec is INLINED into the Value object (kyverno CLI
# apis/v1alpha1/values.go) — these keys sit at the top level, NOT under `spec:`.
#
# The restrict-pod-exec policy matches on a namespaceSelector, so the CLI needs the
# tenant label for sp-nb-tenant-labeled and must see kube-system as unlabeled (so the
# policy correctly does not apply there).
apiVersion: cli.kyverno.io/v1alpha1
kind: Value
metadata:
  name: restrict-pod-exec-values
namespaceSelector:
  - name: sp-nb-tenant-labeled
    labels:
      signalpilot.dev/tenant: user
  - name: kube-system
    labels:
      kubernetes.io/metadata.name: kube-system
