---
# kyverno test for restrict-pod-exec-signalpilot ClusterPolicy (F-21).
#
# Run with:
#   kyverno test deploy/k8s/admission/ --file-name restrict-pod-exec.test.yaml
# or via deploy/k8s/validate-admission-policies.sh (which also runs the live checks).
#
# WHAT THIS FILE CAN AND CANNOT PROVE — read before adding assertions here.
#
# The policy matches `Pod/exec` with `operations: [CONNECT]`. The Kyverno CLI applies
# static manifests as CREATE and offers no way to set the admission operation, so the
# rules NEVER fire in a CLI test: every resource comes back `Pass / Excluded`.
#
# Worse, that is indistinguishable from a genuine pass. In the CLI source
# (commands/test/output.go) a resource that produced no rule response is recorded as
#   row.Result = Pass; row.Reason = "Excluded"
# UNCONDITIONALLY — the declared `result:` is not consulted. So writing
# `result: fail` here for a hostile exec request yields a GREEN test while proving
# nothing. The previous revision of this file did exactly that (and additionally used
# `namespaces:`, `resource:` and `namespace:` fields that do not exist in the Test
# schema, so it failed to load at all and was never executed).
#
# Therefore:
#   * This file asserts only the one thing the CLI genuinely establishes — that the
#     policy LOADS AND IS VALID, and that it does not misfire on an ordinary Pod CREATE
#     in a tenant namespace. Policy validity is the check that matters most here: the
#     `NotMatch` operator this policy used to carry made the whole ClusterPolicy invalid,
#     so Kyverno rejected it and pods/exec was completely unrestricted.
#   * Actual exec ALLOW/DENY enforcement is validated against a live cluster in
#     validate-admission-policies.sh (Phase B7), which really does `kubectl exec` into a
#     conforming and a non-conforming pod. That is the only place those rules are proven.
#
# Scenario resources live in restrict-pod-exec-resources.yaml; namespace labels in
# restrict-pod-exec-values.yaml.

apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-pod-exec-test
policies:
  - restrict-pod-exec-kyverno.yaml
resources:
  - restrict-pod-exec-resources.yaml
variables: restrict-pod-exec-values.yaml
results:
  # An ordinary Pod CREATE in a labeled tenant namespace must not be affected by an
  # exec-scoped policy. "Pass / Excluded" here is the correct and expected outcome.
  - policy: restrict-pod-exec-signalpilot
    rule: restrict-pod-name
    kind: Pod
    result: pass
    resources:
      - sp-nb-tenant-labeled/nb-abc123def456
  - policy: restrict-pod-exec-signalpilot
    rule: restrict-container
    kind: Pod
    result: pass
    resources:
      - sp-nb-tenant-labeled/nb-abc123def456
