---
# SP-SEC-009: Confine the gateway's RBAC bootstrap capability —
# ValidatingAdmissionPolicy form (default path).
#
# DEFAULT install path — apply this on k8s >= 1.30 with the
# ValidatingAdmissionPolicy GA feature gate enabled (default since 1.30).
# Use the Kyverno form (restrict-rbac-writes-kyverno.yaml) ONLY if your cluster is
# < 1.30 or VAP is disabled. Do NOT install both — see README.md.
#
# Why this exists
#
# The gateway creates tenant notebook namespaces dynamically, so it cannot be given a
# purely static namespaced Role. Its one retained cluster-wide write capability is
# "create a RoleBinding" (deploy/k8s/gateway-runtime-rbac.yaml, ClusterRole
# signalpilot-gateway-runtime-bootstrap), which it uses to bind the ClusterRole
# signalpilot-gateway-notebook-workload into the sp-nb-* namespace it just created.
#
# RBAC alone pins WHAT may be bound (`bind` on clusterroles with resourceNames), but
# it cannot pin WHERE: a compromised gateway could create the same RoleBinding in
# kube-system and thereby grant itself Secrets read there. This policy supplies the
# missing constraint, and unlike require-gvisor and restrict-pod-exec it deliberately
# matches ALL namespaces — scoping it with a namespaceSelector would leave exactly
# the unrelated namespaces this is meant to protect unconstrained.
#
# The namespace-label pivot (rules 5-7)
#
# Rule 2 pins the RoleBinding to namespaces labeled signalpilot.dev/tenant=user, but the
# gateway ALSO holds `namespaces: [create, patch]` cluster-wide (gateway-rbac.yaml,
# gateway-runtime-rbac.yaml). Governing only rbac.authorization.k8s.io therefore left a
# one-hop escalation open:
#
#   1. PATCH namespace/kube-system, adding signalpilot.dev/tenant=user
#   2. CREATE the (now perfectly compliant) signalpilot-gateway-org-binding in kube-system
#   3. the workload ClusterRole's verbs — Secrets read, pods, pods/exec — now apply in
#      kube-system, i.e. every service-account token on the cluster
#
# Rule 2's predicate was attacker-controlled. Rules 5-7 take that control away by
# governing core/v1 namespaces as well: the label may only ever appear on a namespace
# whose name carries the gateway's tenant prefix, never on a reserved/system namespace,
# and never be grafted onto a namespace that the gateway did not itself create.
#
# Defense-in-depth layer over:
#   - RBAC `bind` resourceNames pin (gateway-runtime-rbac.yaml)
#   - Absence of any ClusterRoleBinding for the workload ClusterRole in this repo
#   - Fixed names in code (namespaces.py GATEWAY_WORKLOAD_CLUSTER_ROLE /
#     GATEWAY_ORG_BINDING_NAME)
#
# The policy is SA-agnostic and group-agnostic: it constrains the OBJECT, not the
# caller, so operators using a non-default SP_GATEWAY_SERVICE_ACCOUNT or a non-default
# EKS access-entry group need zero policy edits. Cluster-admins are also bound by it —
# intentionally, since a stray ClusterRoleBinding is the regression being prevented.

apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: restrict-rbac-writes-signalpilot
  labels:
    app.kubernetes.io/managed-by: signalpilot
    signalpilot.dev/component: admission
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rolebindings", "clusterrolebindings"]
      # Namespaces are matched too: rule 2's tenant label is a security predicate, so
      # who may set it has to be governed as tightly as the RoleBinding itself.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  variables:
    # The one ClusterRole the gateway is allowed to bind, and the only name its
    # RoleBinding may carry. Keep in sync with namespaces.py.
    - name: workloadRole
      expression: "'signalpilot-gateway-notebook-workload'"
    - name: bindingName
      expression: "'signalpilot-gateway-org-binding'"
    - name: isRbacWrite
      expression: "request.resource.group == 'rbac.authorization.k8s.io'"
    # True only for writes that reference the workload ClusterRole; every other RBAC
    # write in the cluster passes untouched. The isRbacWrite guard short-circuits the
    # roleRef field access, which does not exist on a Namespace object.
    - name: bindsWorkloadRole
      expression: >-
        variables.isRbacWrite &&
        object.roleRef.kind == 'ClusterRole' &&
        object.roleRef.name == variables.workloadRole
    - name: isNamespaced
      expression: "request.resource.resource == 'rolebindings'"

    # ── namespace-label governance (rules 5-7) ────────────────────────────────────
    - name: isNamespaceWrite
      expression: "request.resource.group == '' && request.resource.resource == 'namespaces'"
    - name: tenantLabelKey
      expression: "'signalpilot.dev/tenant'"
    # DEFAULT_NAMESPACE_PREFIX in namespaces.py, plus the separator. Namespace names are
    # <prefix>-<sha256(org_id)[:16]>. Operators who override SP_NOTEBOOK_NAMESPACE_PREFIX
    # MUST change this string too — otherwise the gateway's own namespace creation is
    # denied (fails closed, loudly, on the first session).
    - name: tenantPrefix
      expression: "'sp-nb-'"
    # Deliberately keyed on the PRESENCE of the label, not on the value 'user'. Rule 2
    # only cares about =user, but leaving other values ungoverned would create a second
    # surface the moment any policy starts keying on them.
    - name: nsHasTenantLabel
      expression: >-
        variables.isNamespaceWrite && has(object.metadata.labels) &&
        variables.tenantLabelKey in object.metadata.labels
    - name: nsName
      expression: "variables.isNamespaceWrite ? object.metadata.name : ''"
    # Names that must never be able to hold the tenant label regardless of prefix, so a
    # mistyped tenantPrefix can never open the pivot back up.
    - name: nsReserved
      expression: >-
        variables.nsName.startsWith('kube-') ||
        variables.nsName in ['default', 'signalpilot', 'kyverno', 'kube-system',
                             'kube-public', 'kube-node-lease']
  validations:
    # Rule 1 — the workload ClusterRole must NEVER be granted cluster-wide. This is
    # the exact SP-SEC-009 regression: one ClusterRoleBinding here and pods, exec, and
    # Secrets are back in every namespace.
    - expression: "!(variables.bindsWorkloadRole && !variables.isNamespaced)"
      message: >-
        signalpilot-gateway-notebook-workload must never be bound by a
        ClusterRoleBinding (SP-SEC-009). Bind it per-namespace with a RoleBinding.
    # Rule 2 — a RoleBinding to it may exist only in a labeled tenant notebook
    # namespace. Blocks binding it into kube-system, the gateway's own namespace, or
    # any other unrelated namespace.
    - expression: >-
        !(variables.bindsWorkloadRole && variables.isNamespaced) ||
        (has(namespaceObject.metadata.labels) &&
         'signalpilot.dev/tenant' in namespaceObject.metadata.labels &&
         namespaceObject.metadata.labels['signalpilot.dev/tenant'] == 'user')
      message: >-
        signalpilot-gateway-notebook-workload may only be bound in namespaces labeled
        signalpilot.dev/tenant=user (tenant notebook namespaces).
    # Rule 3 — fixed binding name. Keeps the capability to a single, auditable object
    # per namespace instead of an unbounded set of gateway-minted bindings.
    - expression: >-
        !(variables.bindsWorkloadRole && variables.isNamespaced) ||
        object.metadata.name == variables.bindingName
      message: >-
        A RoleBinding to signalpilot-gateway-notebook-workload must be named
        signalpilot-gateway-org-binding.
    # Rule 4 — subjects may only be ServiceAccounts or named Groups. `User` subjects
    # and any `system:` group (system:authenticated, system:masters, ...) are rejected:
    # either would hand the notebook workload verbs, Secrets included, to principals
    # far wider than the gateway.
    # `subjects` is optional on a RoleBinding, so guard the field access — an absent
    # or empty subject list grants nobody anything and is allowed through.
    - expression: >-
        !variables.bindsWorkloadRole || !has(object.subjects) ||
        object.subjects.all(s,
          (s.kind == 'ServiceAccount' && has(s.namespace)) ||
          (s.kind == 'Group' && !s.name.startsWith('system:')))
      message: >-
        Subjects of signalpilot-gateway-org-binding must be namespaced
        ServiceAccounts or named Groups. User subjects and system:* groups are denied.
    # Rule 5 — the tenant label may only live on a namespace named sp-nb-*. This is what
    # makes rule 2's predicate non-forgeable: the gateway holds namespaces create+patch
    # cluster-wide, so without this it could label ANY namespace (kube-system included)
    # and then legitimately bind the workload role there.
    - expression: >-
        !variables.nsHasTenantLabel ||
        variables.nsName.startsWith(variables.tenantPrefix)
      message: >-
        The label signalpilot.dev/tenant may only be set on tenant notebook namespaces
        named sp-nb-* (SP-SEC-009). Labelling any other namespace would let the gateway
        bind signalpilot-gateway-notebook-workload there.
    # Rule 6 — belt and braces: system and platform namespaces can never carry the label
    # even if tenantPrefix is ever misconfigured to something they'd match.
    - expression: "!variables.nsHasTenantLabel || !variables.nsReserved"
      message: >-
        kube-system, kube-public, kube-node-lease, default, kube-* and the SignalPilot
        control-plane namespace may never carry signalpilot.dev/tenant (SP-SEC-009).
    # Rule 7 — the label may not be grafted onto a pre-existing namespace. ensure_org_namespace
    # sets both labels in the CREATE call, so a namespace acquiring the tenant label on
    # UPDATE without signalpilot.ai/managed-by=gateway was not created by the gateway and
    # is being adopted — the exact move a compromised gateway makes on a namespace that
    # already holds something worth stealing.
    - expression: >-
        !variables.nsHasTenantLabel || request.operation != 'UPDATE' ||
        (has(oldObject.metadata.labels) &&
         variables.tenantLabelKey in oldObject.metadata.labels) ||
        ('signalpilot.ai/managed-by' in object.metadata.labels &&
         object.metadata.labels['signalpilot.ai/managed-by'] == 'gateway')
      message: >-
        signalpilot.dev/tenant may not be added to a pre-existing namespace
        (SP-SEC-009). Tenant namespaces are created with the label already set, and must
        also carry signalpilot.ai/managed-by=gateway.

---

apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: restrict-rbac-writes-signalpilot-binding
  labels:
    app.kubernetes.io/managed-by: signalpilot
    signalpilot.dev/component: admission
spec:
  policyName: restrict-rbac-writes-signalpilot
  validationActions: [Deny]
  # matchResources is deliberately omitted: no namespaceSelector, no objectSelector.
  # The policy must cover EVERY namespace, including the unrelated ones a compromised
  # gateway would target — scoping it to signalpilot.dev/tenant=user would reproduce the
  # gap SP-SEC-009 called out in the neighbouring policies.
