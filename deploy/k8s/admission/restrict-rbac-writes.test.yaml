---
# kyverno test for restrict-rbac-writes-signalpilot ClusterPolicy (SP-SEC-009).
#
# Run with:
#   kyverno test deploy/k8s/admission/ --file-name restrict-rbac-writes.test.yaml
# or, for every admission test plus the live-cluster checks:
#   deploy/k8s/validate-admission-policies.sh
#
# NOTE on --file-name: the Kyverno CLI only auto-discovers files literally named
# kyverno-test.yaml, so this repo's `<policy>.test.yaml` convention MUST be passed
# explicitly with -f/--file-name. A bare `kyverno test deploy/k8s/admission/` prints
# "No test yamls available" and exits 0 — a silent no-op. Use the wrapper script.
#
# NOTE on schema (kyverno CLI >= 1.14): results entries take `resources: [name]` or
# `resourceSpecs: [{kind, namespace, name}]`. There is no singular `resource:` field and
# no `namespace:` field on a result, and no top-level `namespaces:` on the Test — all
# three are rejected by the strict decoder. Namespace labels belong in the Value file
# (restrict-rbac-writes-values.yaml). resourceSpecs is used below because Cases A, D
# and F share the name signalpilot-gateway-org-binding and differ only by namespace.
#
# Cases (resources in restrict-rbac-writes-resources.yaml):
#   A: signalpilot-gateway-org-binding in a labeled tenant namespace, SA + Group
#      subjects → passes every rule (the legitimate gateway write)
#   B: correct roleRef but an unpinned binding name → deny
#      (restrict-workload-binding-name)
#   C: the workload ClusterRole bound cluster-wide → deny
#      (deny-clusterwide-workload-binding) — this is the SP-SEC-009 regression
#   D: User subject on the gateway binding → deny
#      (restrict-workload-binding-subject-kinds)
#   E: an unrelated RoleBinding (roleRef: view) → rules do not fire
#   F: correct name and subjects but bound into an unlabeled namespace (kube-system)
#      → deny (restrict-workload-binding-namespace). NOT assertable here: the rule's
#      apiCall is mocked per-rule and cannot vary per-namespace for same-named
#      resources. Validated against live Kyverno in kind by
#      validate-admission-policies.sh.
#   G: subject kind is Group but the group is system:authenticated → deny
#      (restrict-workload-binding-subject-groups)
#   H: the gateway's own namespace CREATE (sp-nb-<16hex>, tenant + managed-by labels)
#      → passes both namespace rules
#   I: kube-system carrying signalpilot.dev/tenant=user — THE PIVOT → deny by both
#      restrict-tenant-label-to-tenant-namespaces and deny-tenant-label-on-system-namespaces
#   J: an ordinary non-system namespace carrying the label → deny by the sp-nb-* prefix
#      rule only (proves rule 5 is not just a restatement of rule 6's deny-list)
#   K: a namespace with no tenant label → neither namespace rule fires
#
# Rule deny-tenant-label-adoption-on-update matches operations [UPDATE] only and is NOT
# assertable here: the CLI only ever simulates CREATE, so it reports Skip/Excluded for
# every resource (same limitation as restrict-pod-exec.test.yaml). It is validated live
# in kind by validate-admission-policies.sh (B2/B3 "label pre-existing ns" cases).

apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-rbac-writes-test
policies:
  - restrict-rbac-writes-kyverno.yaml
resources:
  - restrict-rbac-writes-resources.yaml
variables: restrict-rbac-writes-values.yaml
results:
  # Case A: the legitimate gateway binding — every rule must allow it.
  - policy: restrict-rbac-writes-signalpilot
    rule: restrict-workload-binding-name
    kind: RoleBinding
    result: pass
    resources:
      - sp-nb-tenant-labeled/signalpilot-gateway-org-binding
  - policy: restrict-rbac-writes-signalpilot
    rule: restrict-workload-binding-subject-kinds
    kind: RoleBinding
    result: pass
    resources:
      - sp-nb-tenant-labeled/signalpilot-gateway-org-binding
  # Rule 2 ALLOW path, with the namespace-label apiCall mocked to tenantLabel=user.
  - policy: restrict-rbac-writes-signalpilot
    rule: restrict-workload-binding-namespace
    kind: RoleBinding
    result: pass
    resources:
      - sp-nb-tenant-labeled/signalpilot-gateway-org-binding

  # Case B: unpinned binding name → deny.
  - policy: restrict-rbac-writes-signalpilot
    rule: restrict-workload-binding-name
    kind: RoleBinding
    result: fail
    resources:
      - sp-nb-tenant-labeled/attacker-extra-binding

  # Case C: cluster-wide binding of the workload role → deny.
  - policy: restrict-rbac-writes-signalpilot
    rule: deny-clusterwide-workload-binding
    kind: ClusterRoleBinding
    result: fail
    resources:
      - signalpilot-gateway-runtime-binding

  # Case D: User subject → deny.
  - policy: restrict-rbac-writes-signalpilot
    rule: restrict-workload-binding-subject-kinds
    kind: RoleBinding
    result: fail
    resources:
      - sp-nb-user-subject/signalpilot-gateway-org-binding

  # Case E: unrelated RoleBinding (roleRef: view) → rules must not fire.
  - policy: restrict-rbac-writes-signalpilot
    rule: restrict-workload-binding-name
    kind: RoleBinding
    result: pass
    resources:
      - sp-nb-tenant-labeled/some-team-view
  - policy: restrict-rbac-writes-signalpilot
    rule: restrict-workload-binding-subject-kinds
    kind: RoleBinding
    result: pass
    resources:
      - sp-nb-tenant-labeled/some-team-view
  - policy: restrict-rbac-writes-signalpilot
    rule: restrict-workload-binding-subject-groups
    kind: RoleBinding
    result: pass
    resources:
      - sp-nb-tenant-labeled/some-team-view

  # Case A again, for the system:* group rule — the real gateway subjects
  # (a namespaced ServiceAccount + the named group signalpilot-gateway-ec2) must pass.
  - policy: restrict-rbac-writes-signalpilot
    rule: restrict-workload-binding-subject-groups
    kind: RoleBinding
    result: pass
    resources:
      - sp-nb-tenant-labeled/signalpilot-gateway-org-binding

  # Case G: subject kind is Group, but the group is system:authenticated → deny.
  # The subject KIND rule must NOT fire here (Group is an allowed kind); only the
  # system:* group rule may. Asserting both pins the split introduced in rules 4a/4b.
  - policy: restrict-rbac-writes-signalpilot
    rule: restrict-workload-binding-subject-groups
    kind: RoleBinding
    result: fail
    resources:
      - sp-nb-system-group/signalpilot-gateway-org-binding
  - policy: restrict-rbac-writes-signalpilot
    rule: restrict-workload-binding-subject-kinds
    kind: RoleBinding
    result: pass
    resources:
      - sp-nb-system-group/signalpilot-gateway-org-binding

  # Case H: the gateway's legitimate namespace CREATE must survive both rules.
  - policy: restrict-rbac-writes-signalpilot
    rule: restrict-tenant-label-to-tenant-namespaces
    kind: Namespace
    result: pass
    resources:
      - sp-nb-0123456789abcdef
  - policy: restrict-rbac-writes-signalpilot
    rule: deny-tenant-label-on-system-namespaces
    kind: Namespace
    result: pass
    resources:
      - sp-nb-0123456789abcdef

  # Case I: THE PIVOT — kube-system labelled signalpilot.dev/tenant=user. Both namespace
  # rules must deny it independently; either one alone closes the escalation.
  - policy: restrict-rbac-writes-signalpilot
    rule: restrict-tenant-label-to-tenant-namespaces
    kind: Namespace
    result: fail
    resources:
      - kube-system
  - policy: restrict-rbac-writes-signalpilot
    rule: deny-tenant-label-on-system-namespaces
    kind: Namespace
    result: fail
    resources:
      - kube-system

  # Case J: non-system namespace with the label — only the prefix rule stops it.
  - policy: restrict-rbac-writes-signalpilot
    rule: restrict-tenant-label-to-tenant-namespaces
    kind: Namespace
    result: fail
    resources:
      - plain-ns
  - policy: restrict-rbac-writes-signalpilot
    rule: deny-tenant-label-on-system-namespaces
    kind: Namespace
    result: pass
    resources:
      - plain-ns

  # Case K: control — unlabelled namespace, neither rule may fire.
  - policy: restrict-rbac-writes-signalpilot
    rule: restrict-tenant-label-to-tenant-namespaces
    kind: Namespace
    result: pass
    resources:
      - some-unrelated-ns
  - policy: restrict-rbac-writes-signalpilot
    rule: deny-tenant-label-on-system-namespaces
    kind: Namespace
    result: pass
    resources:
      - some-unrelated-ns
