# gateway-rbac.yaml — Cluster-scope bootstrap RBAC for the SignalPilot gateway.
#
# Apply once before the first session:
#   kubectl apply -f deploy/k8s/gateway-rbac.yaml
#
# This gives the gateway SA the minimum cluster-wide power needed to:
#   1. Create/list/get/patch Namespaces (for per-org namespace bootstrap).
#   2. Create/get RoleBindings in any namespace, and `bind` exactly ONE ClusterRole
#      (signalpilot-gateway-notebook-workload) — so it can grant itself the notebook
#      workload verbs inside each org namespace it creates, and nothing else.
#
# The gateway has NO cluster-wide pod, Secret, exec, Service, NetworkPolicy, or quota
# power. All workload writes arrive through the per-namespace RoleBinding that
# ensure_org_namespace provisions on first-session-for-org in each sp-nb-* namespace.
#
# Bootstrap sequence (order matters — see namespaces.py::ensure_org_namespace):
#   SA authenticates to K8s → creates sp-nb-<hash> Namespace → creates RoleBinding in
#   it to ClusterRole signalpilot-gateway-notebook-workload → THEN creates
#   NetworkPolicies, ResourceQuota, LimitRange, pods, and Secrets in that namespace
#   using the permissions that RoleBinding just granted.
#
# SP-SEC-009 notes:
#   - The workload ClusterRole below is a PERMISSION TEMPLATE. There is deliberately no
#     ClusterRoleBinding for it anywhere in this repo; binding it cluster-wide would
#     restore cluster-wide Secrets/pods/exec access, and
#     admission/restrict-rbac-writes-* rejects exactly that.
#   - The gateway is NOT granted `roles` create. Creating a Role requires the creator to
#     already hold every rule it grants or to hold `escalate`, and `escalate` on roles
#     ignores resourceNames for CREATE (the object name is not in the request path), so
#     it cannot be pinned to one Role name. `bind` on clusterroles DOES honour
#     resourceNames (the name comes from roleRef), so a ClusterRole template plus a
#     pinned `bind` is the only escalation-free way to grant a dynamic namespace.
#   - Apply admission/restrict-rbac-writes-validatingadmissionpolicy.yaml (or the
#     Kyverno variant) alongside this file. RBAC pins WHAT may be bound; that policy
#     pins WHERE (namespaces labeled signalpilot.dev/tenant=user only).

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: signalpilot-gateway
  namespace: signalpilot
  labels:
    signalpilot.ai/managed-by: gateway
    signalpilot.ai/component: gateway

---
# ClusterRole: create/list/get/patch namespaces only (no delete, no update).
# The gateway creates org namespaces lazily on first session.
#   create            orchestrator/namespaces.py::ensure_org_namespace (create_namespace) —
#                     labels signalpilot.dev/tenant and signalpilot.ai/managed-by are set
#                     in the CREATE body, not by a follow-up patch
#   list              orchestrator/jwt_secret_gc.py::gc_orphan_jwt_secrets
#                     (label-selected on signalpilot.dev/tenant=user)
#
# `get` and `patch` HAVE NO CALL SITE. Verified by grep over signalpilot/gateway/gateway:
# the only namespace-scoped API calls are create_namespace and list_namespace; there is no
# read_namespace and no patch_namespace anywhere. This header previously credited
# ensure_org_namespace with using them, which is not true.
#
# `patch` in particular is the pivot lever for SP-SEC-009: it is what let a compromised
# gateway add signalpilot.dev/tenant=user to kube-system and thereby satisfy the
# precondition of the RoleBinding admission rule. Admission rules 5-7 in
# admission/restrict-rbac-writes-* now block that, but the verb itself is still
# unnecessary. RECOMMENDED: drop "get" and "patch" here and in
# gateway-runtime-rbac.yaml, leaving ["create", "list"]. Not done in this change because
# removing a verb is a runtime behaviour change and wants its own deploy; the admission
# policy closes the escalation either way. Defence in depth, not defence instead.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: signalpilot-gateway-namespaces
  labels:
    signalpilot.ai/managed-by: gateway
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "patch"]

---
# ClusterRole: the notebook workload permissions, defined ONCE for every deployment
# path (in-cluster SA and off-cluster EC2 group alike).
#
# TEMPLATE ONLY — never bind this with a ClusterRoleBinding. It is referenced by the
# namespaced RoleBinding that orchestrator/namespaces.py::_gateway_org_role_binding
# creates in each sp-nb-* namespace; a RoleBinding to a ClusterRole grants its rules
# only inside that namespace, which is what keeps these verbs off the cluster scope.
#
# Every rule has a gateway call site; there are no speculative verbs:
#   pods create/get/delete       orchestrator/kubernetes.py create_pod, delete_pod,
#                                get_pod, _is_pod_container_ready, stale-pod reap
#   pods patch                   reserved for in-place pod metadata updates
#   pods/log, pods/status        operator-facing debug reads (no gateway call site)
#   pods/exec create,get         orchestrator/pod_exec_io.py::exec_command_in_pod
#                                (workspace sync / export). Container is hardcoded
#                                "notebook"; RBAC cannot prefix-match the dynamic
#                                nb-<12hex> pod names, so this grant is narrowed
#                                further by admission/restrict-pod-exec-*.
#   secrets create/patch/delete  orchestrator/jwt_secret_lifecycle.py (per-session
#                                sp-jwt-<pod> staging, ownerRef patch, rollback)
#   secrets get/list/delete      orchestrator/jwt_secret_gc.py (orphan JWT GC)
#   resourcequotas, limitranges  orchestrator/namespaces.py::ensure_org_namespace
#   networkpolicies create       orchestrator/namespaces.py (default-deny,
#                                allow-gateway, block-imds-egress)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: signalpilot-gateway-notebook-workload
  labels:
    signalpilot.ai/managed-by: gateway
    # Tripwire for `kubectl get clusterrolebindings` audits: this role must appear in
    # RoleBinding roleRefs only, never in a ClusterRoleBinding.
    signalpilot.ai/binding-scope: namespaced-only
rules:
  - apiGroups: [""]
    resources: ["pods", "resourcequotas", "limitranges"]
    verbs: ["create", "get", "list", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/status"]
    verbs: ["get", "list"]
  # Read-only, tenant-namespace only. The sandbox dashboard surfaces these to
  # distinguish a pod that is slow (pulling, scheduling) from one that is broken
  # (ImagePullBackOff, OOMKilled, gVisor refusal). Verified absent on the live
  # cluster, where the events panel would otherwise silently degrade.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  # Secrets are namespaced here and ONLY here. A cluster-wide Secrets verb for the
  # gateway was the SP-SEC-009 disclosure path.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "delete", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "delete", "patch"]

---
# ClusterRole: create/get RoleBindings in any namespace, and bind the one workload
# ClusterRole above. Required so ensure_org_namespace can install the per-namespace
# RoleBinding that grants the gateway workload write power within that namespace only.
# No cluster-wide pod/secret/exec/networkpolicy/quota/limitrange verbs here, no Role
# creation, and no `escalate`.
#
# `bind` is pinned by resourceNames to a single ClusterRole: even if this grant were
# abused, the only thing it can hand out is the notebook workload set — and
# admission/restrict-rbac-writes-* confines that to labeled tenant namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: signalpilot-gateway-rbac-provisioner
  labels:
    signalpilot.ai/managed-by: gateway
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create", "get"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["signalpilot-gateway-notebook-workload"]

---
# ClusterRoleBinding: bind the gateway SA to both ClusterRoles above.
# These are the only cluster-level bindings; all pod/Secret/workload operations
# require the per-namespace RoleBinding that the gateway provisions for itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: signalpilot-gateway-cluster-bindings
  labels:
    signalpilot.ai/managed-by: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # Bind to both ClusterRoles above via a single binding to each.
  # Note: ClusterRoleBinding can only reference one roleRef. Use two bindings.
  name: signalpilot-gateway-namespaces
subjects:
  - kind: ServiceAccount
    name: signalpilot-gateway
    namespace: signalpilot

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: signalpilot-gateway-rbac-provisioner-binding
  labels:
    signalpilot.ai/managed-by: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: signalpilot-gateway-rbac-provisioner
subjects:
  - kind: ServiceAccount
    name: signalpilot-gateway
    namespace: signalpilot
