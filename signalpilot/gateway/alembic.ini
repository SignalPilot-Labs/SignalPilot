# Alembic configuration for the SignalPilot gateway schema.
#
# The migration environment reads the database URL from DATABASE_URL (same
# variable the gateway itself uses); sqlalchemy.url here is only a fallback
# for local CLI use.
#
# CLI usage (from signalpilot/gateway/):
#   uv run alembic upgrade head
#   uv run alembic revision -m "describe change"

[alembic]
script_location = %(here)s/gateway/db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
