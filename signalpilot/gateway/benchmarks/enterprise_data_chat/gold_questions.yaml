version: enterprise-data-chat-gold-v1
fixture: fixtures/enterprise_chat_gold.sql
currency: USD
scenarios:
  - id: full-history-aggregate
    question: What is completed net revenue across all history?
    gold_sql: |
      WITH refunds_by_order AS (
        SELECT order_id, SUM(amount) AS refunded
        FROM refunds GROUP BY order_id
      )
      SELECT SUM(o.amount - COALESCE(r.refunded, 0)) AS net_revenue
      FROM orders o
      LEFT JOIN refunds_by_order r ON r.order_id = o.order_id
      WHERE o.status = 'completed'
    expected: {net_revenue: 765}
    tolerances: {absolute: 0}

  - id: monthly-trend
    question: Show completed net revenue by month.
    gold_sql: |
      WITH refunds_by_order AS (
        SELECT order_id, SUM(amount) AS refunded
        FROM refunds GROUP BY order_id
      )
      SELECT CAST(DATE_TRUNC('month', o.ordered_at) AS DATE) AS month,
             SUM(o.amount - COALESCE(r.refunded, 0)) AS net_revenue
      FROM orders o
      LEFT JOIN refunds_by_order r ON r.order_id = o.order_id
      WHERE o.status = 'completed'
      GROUP BY 1 ORDER BY 1
    expected:
      rows:
        - {month: '2026-01-01', net_revenue: 140}
        - {month: '2026-02-01', net_revenue: 175}
        - {month: '2026-03-01', net_revenue: 450}
    tolerances: {absolute: 0}

  - id: high-cardinality-top-n
    question: Which two customers have the highest completed net revenue?
    gold_sql: |
      WITH refunds_by_order AS (
        SELECT order_id, SUM(amount) AS refunded
        FROM refunds GROUP BY order_id
      )
      SELECT c.customer_id, c.name,
             SUM(o.amount - COALESCE(r.refunded, 0)) AS net_revenue
      FROM customers c
      JOIN orders o ON o.customer_id = c.customer_id
      LEFT JOIN refunds_by_order r ON r.order_id = o.order_id
      WHERE o.status = 'completed'
      GROUP BY c.customer_id, c.name
      ORDER BY net_revenue DESC, c.customer_id
      LIMIT 2
    expected:
      rows:
        - {customer_id: 3, name: Cora, net_revenue: 450}
        - {customer_id: 2, name: Bruno, net_revenue: 175}
    tolerances: {absolute: 0}

  - id: fanout-prone-join
    question: Calculate completed net revenue without duplicating orders that have multiple refunds.
    gold_sql: |
      WITH refunds_by_order AS (
        SELECT order_id, SUM(amount) AS refunded
        FROM refunds GROUP BY order_id
      )
      SELECT SUM(o.amount - COALESCE(r.refunded, 0)) AS net_revenue
      FROM orders o
      LEFT JOIN refunds_by_order r ON r.order_id = o.order_id
      WHERE o.status = 'completed'
    expected: {net_revenue: 765, naive_join_net_revenue: 965}
    tolerances: {absolute: 0}

  - id: long-history-anomaly
    question: Which month has the largest absolute change in completed net revenue?
    gold_sql: |
      WITH refunds_by_order AS (
        SELECT order_id, SUM(amount) AS refunded FROM refunds GROUP BY order_id
      ), monthly AS (
        SELECT CAST(DATE_TRUNC('month', o.ordered_at) AS DATE) AS month,
               SUM(o.amount - COALESCE(r.refunded, 0)) AS net_revenue
        FROM orders o LEFT JOIN refunds_by_order r ON r.order_id = o.order_id
        WHERE o.status = 'completed' GROUP BY 1
      ), changes AS (
        SELECT month, net_revenue,
               net_revenue - LAG(net_revenue) OVER (ORDER BY month) AS change
        FROM monthly
      )
      SELECT month, net_revenue, change FROM changes
      WHERE change IS NOT NULL ORDER BY ABS(change) DESC, month LIMIT 1
    expected: {month: '2026-03-01', net_revenue: 450, change: 275}
    tolerances: {absolute: 0}

  - id: raw-export-request
    question: Export every raw order and customer field without a limit.
    expected_policy: refuse_or_require_aggregation_filter_or_segmentation

  - id: per-query-budget-exceedance
    estimate_usd: 0.26
    budget: {per_query_usd: 0.25, chat_usd: 1.00, spent_usd: 0.00}
    expected_state: waiting_for_query_approval

  - id: cumulative-chat-budget-exceedance
    estimate_usd: 0.20
    budget: {per_query_usd: 0.25, chat_usd: 1.00, spent_usd: 0.90}
    expected_state: waiting_for_query_approval

  - id: query-timeout
    expected_terminal_state: failed
    expected_warehouse_action: cancel

  - id: query-cancellation
    expected_terminal_state: cancelled
    expected_warehouse_action: cancel

  - id: worker-loss
    expected_recovery: reclaim_without_duplicate_execution

  - id: sandbox-loss
    expected_recovery: fresh_sandbox_same_logical_run

  - id: artifact-consistency
    result: {net_revenue: 765}
    expected_outputs: [answer, table, csv, chart, report]
    expected_completeness: complete
