<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SignalPilot MCP App demo</title>
<style>
body{margin:0;padding:24px;font:15px system-ui;color:var(--color-text-primary,#182e34);background:var(--color-background-primary,#f5faf9)}
h2{margin:8px 0}small{color:var(--color-text-secondary,#526c70)}
button{padding:11px 18px;border:0;border-radius:9px;background:#087e75;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}
#status{margin:18px 0;font-weight:600}#clock{font-family:monospace;overflow-wrap:anywhere}#error{color:#c43c35;white-space:pre-wrap}
</style></head><body>
<small>SIGNALPILOT / INTERACTIVE MCP DEMO</small><h2>Your gateway, inside Cowork</h2>
<p>This is a real embedded app. No agent is launched and no SQL is executed.</p>
<div id="status" role="status">Connecting to host...</div><p id="clock">Waiting for server time</p>
<button id="ping" disabled>Ping gateway</button><p><small id="count">0 button-triggered calls</small></p>
<pre id="error" role="alert"></pre>
<script>
// Minimal standard MCP Apps bridge for this dependency-free smoke demo.
const pending=new Map();let nextId=1,clicks=0,closed=false;
const el=id=>document.getElementById(id);
function send(message){window.parent.postMessage({jsonrpc:'2.0',...message},'*')}
function request(method,params){return new Promise((resolve,reject)=>{
 const id=nextId++;const timer=setTimeout(()=>{pending.delete(id);reject(new Error(method+' timed out after 15 seconds'))},15000);
 pending.set(id,{resolve,reject,timer});send({id,method,params});
})}
function render(result){
 if(result?.isError)throw new Error((result.content||[]).map(x=>x.text||'').join('\n')||'Tool failed');
 const data=result?.structuredContent;if(!data)return;
 el('status').textContent=data.message;el('clock').textContent='Gateway UTC: '+data.server_time;
}
function theme(context){if(context?.theme)document.documentElement.style.colorScheme=context.theme}
window.addEventListener('message',event=>{
 if(event.source!==window.parent)return;
 const message=event.data;if(!message||message.jsonrpc!=='2.0')return;
 const call=pending.get(message.id);
 if(call&&('result'in message||'error'in message)){
  clearTimeout(call.timer);pending.delete(message.id);
  message.error?call.reject(new Error(message.error.message||'Host rejected request')):call.resolve(message.result);return;
 }
 try{
  if(message.method==='ui/notifications/tool-result')render(message.params);
  if(message.method==='ui/notifications/host-context-changed')theme(message.params);
  if(message.method==='ping')send({id:message.id,result:{}});
  if(message.method==='ui/resource-teardown'){
   closed=true;el('ping').disabled=true;
   for(const call of pending.values()){clearTimeout(call.timer);call.reject(new Error('View closed'))}pending.clear();
   send({id:message.id,result:{}});
  }
 }catch(error){el('error').textContent=error.message}
});
el('ping').onclick=async()=>{
 el('ping').disabled=true;el('error').textContent='';
 try{render(await request('tools/call',{name:'ping_signalpilot_app_demo',arguments:{}}));
  el('count').textContent=(++clicks)+' button-triggered calls';
 }catch(error){el('error').textContent=error.message}
 finally{if(!closed)el('ping').disabled=false}
};
(async()=>{
 try{
  const result=await request('ui/initialize',{appInfo:{name:'SignalPilot demo',version:'1.0.0'},appCapabilities:{availableDisplayModes:['inline']},protocolVersion:'2026-01-26'});
  theme(result.hostContext);send({method:'ui/notifications/initialized',params:{}});
  send({method:'ui/notifications/size-changed',params:{height:document.documentElement.scrollHeight}});
  el('status').textContent='Host bridge connected';
  if(result.hostCapabilities?.serverTools)el('ping').disabled=false;
  else el('error').textContent='This host does not advertise app-to-server tool calls.';
 }catch(error){el('error').textContent=error.message;el('status').textContent='Host connection failed'}
})();
</script></body></html>
